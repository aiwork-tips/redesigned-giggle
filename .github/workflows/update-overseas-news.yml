name: Update overseas retro-gaming research topics
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_overseas_news.py'
      - 'tests/test_overseas_news.py'
      - '.github/workflows/update-overseas-news.yml'
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: export-scout-overseas-retro-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify RSS parser and evidence rules offline
        run: python -m unittest discover -s tests -p 'test_overseas_news.py' -v
      - name: Fetch official overseas retro-gaming publisher RSS
        run: python scripts/update_overseas_news.py
      - name: Commit only verified article-topic updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/overseas_news_signals.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update overseas retro gaming article research leads"
            git push
          fi
