name: Update public USDJPY reference rate
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: export-scout-fx-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline validation tests
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate reference rate
        run: python scripts/update_fx.py
      - name: Commit updated data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public USDJPY reference rate"
            git push
          fi
