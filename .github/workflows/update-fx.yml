name: Check free FX API and validation
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Check public FX endpoint without publishing or redistributing rates
        run: python scripts/update_fx.py
