name: Test Export Scout
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test automatic data processing (offline)
        run: python -m unittest discover -s tests -v
      - name: Validate frontend document and JavaScript
        run: python scripts/check_site.py
      - name: Test FX UI behavior offline
        run: node tests/test_fx_ui.cjs
      - name: Test source-linked opportunity viewer offline
        run: node tests/test_opportunity_ui.cjs
      - name: Test verified trend links and local shortlist offline
        run: node tests/test_trends_ui.cjs
